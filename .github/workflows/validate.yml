name: validate
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # weekly: detects dead or tampered package links
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fogelmanjg/redroid-forge
          path: forge
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate (same validator as redroid-forge)
        run: node tools/build.js --forge forge
      - name: Packages still download to the declared sha256
        run: node tools/check-urls.js
